{% load static %}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
    <title>LITReview</title>
</head>


<body>
    <div class="main-container">
        <header> 
                            
            <h1>LITReview</h1>

            {% if user.is_authenticated %}
                <nav>
                    <a href="{% url 'feed' %}">Flux</a>
                    <a href="{% url 'user_posts' %}">Posts</a>
                    <a href="{% url 'userfollows' %}">Abonnements</a>
                    <a href="{% url 'logout' %}">Se déconnecter</a>
                </nav>
            {% endif %}
          
        </header>
    <div>

    <main id="content">
        {% block content %}{% endblock %} 
    </main>
</body>
</html>
