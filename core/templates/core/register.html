register{% extends "core/core.html" %}

{% block content %}
    <div id="register_panel">
        <form method="post">
            {% csrf_token %}
            {{ form.errors }}
            {% for field in form %}
                <div class="form-field">
                    {{ field.label_tag }}
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}
            <button type="submit">S'inscrire</button>
        </form>
    </div>
{% endblock %}
