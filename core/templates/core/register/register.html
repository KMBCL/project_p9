{% extends "core/core.html" %}

{% block content %}
    <h2>Inscrivez-vous</h2>
    
    <form method="post" class="form">
        {% csrf_token %}
        {% include "core/components/form_errors.html" %}
        
        {% include "core/components/form_content.html" %}
        
        <div class="form__register-button">
            <button class="validate-button">
                <a href="{% url 'home' %}">Retourner</a>
            </button>
            <button class="validate-button" type="submit">
                S'enregistrer
            </button>
        </div>
    </form>
{% endblock %}
