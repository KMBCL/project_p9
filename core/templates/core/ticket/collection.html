{% extends "core/core.html" %}

{% block content %}

    <ul>
        {% for ticket in tickets %}
            <li>
                <a href="{% url 'ticket_detail' ticket.pk %}">Details</a>
                {{ ticket.time_created }} - 
                {{ ticket.title }} : {{ ticket.description }}
                {{ ticket.image }}
            </li>
        {% endfor %}
    </ul>

{% endblock %}
