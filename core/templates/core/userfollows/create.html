{% extends "core/core.html" %}

{% block content %}
    <h2>Suivre d'autres utilisateurs</h2>
    
    <section id="to_follow_panel">
        <form method="post" class="login-panel">
            <div class="login-panel__form">
                {% include "core/components/form_content.html" %}
            </div>
            <div class="login-panel__button">
                <button class="validate-button" type="submit">
                    Envoyer
                </button>            
            </div>
        </form>
    </section>

    <h2>Abonnements</h2>

    <section id="following_panel">
        <ul class="following_panel__users">
            {% for followed_user in user_follows%}
                <li class="following_panel__user"> 
                    {{ followed_user.followed_user.username }} 
                    
                    <button class="validate-button">
                        <a href="{% url 'userfollows_delete' followed_user.pk %}">Arrêter de suivre</a>
                    </button>    
                </li>
            {% endfor %}
        </ul>
    </section>

    <h2>Abonnés</h2>
    <section id="following_panel">
        <ul>
            
        </ul>
    </section>
{% endblock %}
